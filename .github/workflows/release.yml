name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Get version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "from app.version import __version__; print(__version__)"
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build with PyInstaller
        run: pyinstaller cci_mail.spec --noconfirm

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $isccDir = "C:\Program Files (x86)\Inno Setup 6"
          if (-not (Test-Path $isccDir)) {
            $isccDir = "C:\Program Files\Inno Setup 6"
          }
          echo $isccDir | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build installer
        shell: pwsh
        run: iscc "/DAppVersion=${{ steps.ver.outputs.VERSION }}" installer\setup.iss

      - name: Create installer checksum
        shell: pwsh
        run: |
          $installer = "installer_output/CCIMail_Setup_${{ steps.ver.outputs.VERSION }}.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLower()
          "$hash  $(Split-Path -Leaf $installer)" |
            Set-Content -Encoding ascii -LiteralPath "$installer.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "商工会議所メール配信システム v${{ steps.ver.outputs.VERSION }}"
          body_path: RELEASE_NOTES.md
          files: |
            installer_output/CCIMail_Setup_${{ steps.ver.outputs.VERSION }}.exe
            installer_output/CCIMail_Setup_${{ steps.ver.outputs.VERSION }}.exe.sha256
          draft: false
          prerelease: false
