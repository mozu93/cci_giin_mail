name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  # v1.2.3 の移行Releaseを旧配布先（このリポジトリ）へ作成するために必要。
  # 全端末が v1.2.3 以降になったら、このジョブと下の移行用ステップは削除できる。
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # トークン未設定・期限切れのままビルドへ数分かけないよう、最初に検査する。
      # 実際にこの検査が無いまま、ビルド成功後のRelease作成で
      # 「Parameter token or opts.auth is required」により失敗した事象がある。
      - name: Verify RELEASES_REPO_TOKEN
        shell: pwsh
        env:
          RELEASES_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASES_REPO_TOKEN)) {
            throw "RELEASES_REPO_TOKEN が未設定です。公開配布リポジトリ " +
              "(mozu93/cci_giin_mail-releases) への Contents: Read and write 権限を持つ " +
              "Fine-grained PAT を、このリポジトリの Actions secret に登録してください。"
          }
          $headers = @{
            Authorization = "Bearer $env:RELEASES_REPO_TOKEN"
            Accept        = "application/vnd.github+json"
            "User-Agent"  = "cci-mail-release"
          }
          try {
            $repo = Invoke-RestMethod -Method Get -Headers $headers `
              -Uri "https://api.github.com/repos/mozu93/cci_giin_mail-releases"
          } catch {
            throw "RELEASES_REPO_TOKEN で公開配布リポジトリにアクセスできません。" +
              "期限切れ・Revoke済み・対象リポジトリ未選択のいずれかの可能性があります: " +
              $_.Exception.Message
          }
          # 権限の見え方はトークン種別で変わりうるため、ここでは警告に留める。
          if (-not $repo.permissions.push) {
            Write-Host "::warning::RELEASES_REPO_TOKEN に書き込み権限が無いように見えます。" +
              "Release作成に失敗する場合は Contents: Read and write を確認してください。"
          }
          Write-Host "配布先リポジトリへの認証を確認した: $($repo.full_name)"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Get version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "from app.version import __version__; print(__version__)"
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build with PyInstaller
        run: pyinstaller cci_mail.spec --noconfirm

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $isccDir = "C:\Program Files (x86)\Inno Setup 6"
          if (-not (Test-Path $isccDir)) {
            $isccDir = "C:\Program Files\Inno Setup 6"
          }
          echo $isccDir | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build installer
        shell: pwsh
        run: iscc "/DAppVersion=${{ steps.ver.outputs.VERSION }}" installer\setup.iss

      - name: Create installer checksum
        shell: pwsh
        run: |
          $installer = "installer_output/CCIMail_Setup_${{ steps.ver.outputs.VERSION }}.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLower()
          "$hash  $(Split-Path -Leaf $installer)" |
            Set-Content -Encoding ascii -LiteralPath "$installer.sha256"

      # 公開配布リポジトリ。v1.2.3以降のアプリはここを更新確認先にする。
      - name: Create public distribution release
        uses: softprops/action-gh-release@v2
        with:
          repository: mozu93/cci_giin_mail-releases
          tag_name: ${{ github.ref_name }}
          name: "議員メール配信アプリ v${{ steps.ver.outputs.VERSION }}"
          body_path: RELEASE_NOTES.md
          files: |
            installer_output/CCIMail_Setup_${{ steps.ver.outputs.VERSION }}.exe
            installer_output/CCIMail_Setup_${{ steps.ver.outputs.VERSION }}.exe.sha256
          draft: false
          prerelease: false
          # 公開配布リポジトリへの書き込み権限だけを持つFine-grained PAT。
          token: ${{ secrets.RELEASES_REPO_TOKEN }}

      # 移行用。v1.2.2以前のアプリはこのリポジトリを更新確認先としているため、
      # 全端末が v1.2.3 以降になるまでは旧配布先にも同じインストーラーを出す。
      # 移行完了後にこのステップと permissions の contents: write を削除する。
      - name: Create legacy release (migration only)
        uses: softprops/action-gh-release@v2
        with:
          name: "議員メール配信アプリ v${{ steps.ver.outputs.VERSION }}"
          body_path: RELEASE_NOTES.md
          files: |
            installer_output/CCIMail_Setup_${{ steps.ver.outputs.VERSION }}.exe
            installer_output/CCIMail_Setup_${{ steps.ver.outputs.VERSION }}.exe.sha256
          draft: false
          prerelease: false
